[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abb-drive-tool-linux"
version = "0.1.0"
description = "Independent Linux drive commissioning and monitoring utility"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "Community contributors"}]
keywords = ["ABB", "ACS550", "Linux", "LinuxCNC", "Modbus RTU", "drive monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = ["PySide6>=6.6", "pyserial>=3.5", "pymodbus>=3.6,<4"]

[project.scripts]
abb-drive-tool = "drive_tool.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
